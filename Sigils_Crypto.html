<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigil Modal Container</title>
    <style>
        body {
            font-family: monospace;
            background-color: #121212;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Tooltip Wrapper */
        .tooltip-container {
            position: relative;
            display: inline-block;
        }

        /* Context Tooltip Bubble */
        .tooltip-container .tooltip-text {
            visibility: hidden;
            width: 160px;
            background-color: #000;
            color: #b026ff;
            text-align: center;
            border-radius: 4px;
            padding: 6px;
            border: 1px solid #b026ff;
            position: absolute;
            z-index: 1;
            bottom: 125%; /* Position above the button */
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 12px;
        }

        .tooltip-container:hover .tooltip-text {
            visibility: visible;
            opacity: 1;
        }

        /* Trigger Button */
        #openModalBtn {
            background: #b026ff;
            color: #000;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }

        #openModalBtn:hover {
            background: #941cd9;
        }

        /* Modal Overlay Background */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        /* The Matrix Box Container Modal */
        .matrix-modal {
            background: #000;
            border: 2px solid #b026ff;
            box-shadow: 0 0 20px rgba(176, 38, 255, 0.4);
            padding: 20px;
            border-radius: 6px;
            text-align: center;
        }

        /* Matrix Screen Grid */
        #matrix-screen {
            width: 40ch;
            height: 18em;
            line-height: 1em;
            white-space: pre;
            text-align: left;
            overflow: hidden;
            background-color: #000;
            font-family: monospace;
            font-size: 14px;
            margin-bottom: 15px;
            color: #b026ff; /* Ensures text inside is purple */
        }

        /* Close Modal Button */
        #closeModalBtn {
            background: transparent;
            color: #b026ff;
            border: 1px solid #b026ff;
            padding: 6px 16px;
            cursor: pointer;
            font-family: monospace;
        }

        #closeModalBtn:hover {
            background: #b026ff;
            color: #000;
        }
    </style>
</head>

<body>

    <div class="tooltip-container">
        <span class="tooltip-text">Click to initialize terminal stream</span>
        <button id="openModalBtn">Open Sigil Modal</button>
    </div>

    <!-- Modal Structure -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="matrix-modal">
            <div id="matrix-screen"></div>
            <button id="closeModalBtn">Close [ESC ENTROPY]</button>
        </div>
    </div>

    <script>
        const chars = [
            '!', '@', '#', '$', '%', '^', '&', '*', '(', ')',
            '!!', '!@', '!#', '!$', '!%', '!^', '!&', '!*', '!(', '!)',
            '@!', '@@', '@#', '@$', '@%', '@^', '@&', '@*', '@(', '@)',
            '#!', '#@', '##', '#$', '#%', '#^', '#&', '#*', '#(', '#)',
            '$!', '$@', '$#', '$$', '$%', '$^', '$&', '$*', '$(', '$)',
            '%!', '%@', '%#', '%$', '%%', '%^', '%&', '%*', '%(', '%)',
            '^!', '^@', '^#', '^$', '^%', '^^', '^&', '^*', '^(', '^)',
            '&!', '&@', '&#', '&$', '&%', '&^', '&&', '&*', '&(', '&)',
            '*!', '*@', '*#', '*$', '*%', '*^', '*&', '**', '*(', '*)',
            '(!', '(@', '(#', '($', '(%', '(^', '(&', '((', '()', '!))'
        ];

        const BOX_WIDTH = 40;
        const BOX_HEIGHT = 18;
        let animationInterval = null;

        const screenDiv = document.getElementById('matrix-screen');
        const modalOverlay = document.getElementById('modalOverlay');
        const openBtn = document.getElementById('openModalBtn');
        const closeBtn = document.getElementById('closeModalBtn');

        let y_pos = new Array(BOX_WIDTH);
        let lengths = new Array(BOX_WIDTH);
        let grid = [];

        function initMatrix() {
            grid = Array.from({ length: BOX_HEIGHT }, () => Array(BOX_WIDTH).fill(' '));
            for (let i = 0; i < BOX_WIDTH; i++) {
                y_pos[i] = Math.floor(Math.random() * BOX_HEIGHT) - BOX_HEIGHT;
                lengths[i] = Math.floor(Math.random() * 4) + 3;
            }
        }

        function updateMatrix() {
            let frameGrid = Array.from({ length: BOX_HEIGHT }, () => Array(BOX_WIDTH).fill(' '));

            for (let x = 0; x < BOX_WIDTH; x++) {
                let head = y_pos[x];
                let len = lengths[x];

                for (let j = 0; j < len; j++) {
                    let curr_y = head - j;
                    if (curr_y >= 0 && curr_y < BOX_HEIGHT) {
                        let randomChar = chars[Math.floor(Math.random() * chars.length)];
                        frameGrid[curr_y][x] = randomChar[0];
                    }
                }

                y_pos[x] += 1;

                if (y_pos[x] - len > BOX_HEIGHT) {
                    y_pos[x] = -Math.floor(Math.random() * 3);
                    lengths[x] = Math.floor(Math.random() * 4) + 3;
                }
            }

            screenDiv.innerHTML = frameGrid.map(row => row.join('')).join('\n');
        }

        function openModal() {
            modalOverlay.style.display = 'flex';
            initMatrix();
            if (!animationInterval) {
                animationInterval = setInterval(updateMatrix, 100);
            }
        }

        function closeModal() {
            modalOverlay.style.display = 'none';
            clearInterval(animationInterval);
            animationInterval = null;
        }

        openBtn.addEventListener('click', openModal);
        closeBtn.addEventListener('click', closeModal);

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>

</html>
